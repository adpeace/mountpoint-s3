# This file (and others in `conf/`) specify some static parameters,
# as well as some which will be 'swept' over for experiments.

defaults:
  - _self_
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - override hydra/sweeper: multi

# ===== Common parameters for all benchmarks =====
s3_bucket: ???
s3_result_bucket: !!null
application_workers: 1
iteration: 0
iterations: 10
run_time: 30  # Default run time in seconds
read_size: 262144 # Defaults to 256KiB, can go up to 1MiB.
read_part_size: !!null
region: "us-east-1"
write_part_size: 16777216  # 16 MiB, to allow for uploads of large files
object_size_in_gib: 100  # Size of the object to benchmark
benchmark_type: "fio" # fio, prefetch, client, client_bp, crt
s3_keys: !!null
download_checksums: true
crt_eventloop_threads: !!null # Number of ELG thread count

# Network configuration
network:
  interface_names: []
  maximum_throughput_gbps: !!null

# Monitoring options (common to all benchmarks)
monitoring:
  with_bwm: false
  with_perf_stat: false
  with_flamegraph: false
  flamegraph_scripts_path: !!null        # Path to directory containing stackcollapse-perf.pl and flamegraph.pl from https://github.com/brendangregg/FlameGraph

# ===== Mountpoint configuration =====
mountpoint:
  fuse_threads: !!null
  max_cursors: !!null  # --max-cursors; 1 disables multi-cursor, >1 enables it. Required for multi_cursor_read.
  prefetch_trace: false  # Raise the log-directory file to prefetch=TRACE for the visualizer/analyze.sh.
  prefix: !!null
  metadata_ttl: "indefinite"
  mountpoint_max_background: !!null
  mountpoint_congestion_threshold: !!null
  mountpoint_binary: !!null
  upload_checksums: !!null
  memory_target: !!null # memory upper-limit in MB
  stub_mode: "off"  # Options: "off", "fs_handler", "s3_client"
  mountpoint_debug: false
  mountpoint_debug_crt: false
  otlp_metrics: false
  otlp_endpoint: !!null # Metrics collector/agent endpoint like "http://localhost:4318"
  otlp_export_interval: !!null  # Export interval in seconds (default: 60)
  otlp_temporality_preference: !!null  # Options: "cumulative", "delta"

# ===== Benchmark-specific configurations =====
benchmarks:
  fio:
    direct_io: false
    fio_benchmarks:
      - sequential_read
      - multi_cursor_read
    fio_benchmark: "${benchmarks.fio.fio_benchmarks[0]}"
    fio_io_engine: "psync"
    # Parameters for the multi_cursor_read job (interleaved single-fd replay). object_size_bytes
    # must match the real object; defaults target the mc-128MiB.bin test object.
    multi_cursor:
      object_key: "mc-128MiB.bin"
      object_size_bytes: 134217728
      # num_cursors is the WORKLOAD shape (how many interleaved read streams the application issues
      # on one fd). It is independent of mountpoint.max_cursors (the prefetcher's cursor cap): an
      # A/B varying only max_cursors must keep this fixed so both arms replay the same workload.
      num_cursors: 8
      pattern: "multi_cursor"  # multi_cursor (contiguous regions) or overlapping_cursors
      visit: 131072  # bytes read per region per round (128 KiB)
      read_size: 65536  # bytes per individual read (64 KiB)

  prefetch:
    memory_target: !!null # memory upper-limit in MB

  crt:
    crt_benchmarks_path: !!null

  client:
    # None

  client_bp:
    backpressure_window_size: !!null #2147483648


hydra:
  help:
    app_name: "Mountpoint benchmark runner"
  mode: MULTIRUN
  job:
    chdir: true

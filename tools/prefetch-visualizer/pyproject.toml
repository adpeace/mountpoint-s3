[project]
name = "prefetch-visualizer"
version = "0.1.0"
description = "Visualize Mountpoint prefetcher cursor activity from a debug/trace log file"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
prefetch-visualizer = "prefetch_visualizer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prefetch_visualizer"]
